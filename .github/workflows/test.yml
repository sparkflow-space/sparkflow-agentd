# The gates, on GitHub — this repository's home.
#
# Ported from the .gitlab-ci.yml this project started with. Two lessons from
# that file are kept deliberately:
#
# * The Go MINOR follows go.mod (`go 1.25.0` → 1.25.x), and the PATCH is the
#   latest one. On GitLab the image was golang:1.24 against a go.mod asking for
#   1.25.0; with GOTOOLCHAIN=local that failed the first command of every
#   pipeline the repository ever ran, while local gates were green.
#   `go-version-file: go.mod` was tried first and is subtly worse: with no
#   `toolchain` line it installs EXACTLY 1.25.0 — the build, vet and race gates
#   then run on a compiler without the 1.25 security and runtime fixes. Bump
#   the minor here in the same commit that bumps go.mod.
# * Actions are pinned by commit SHA (the tag is in the comment): this
#   repository is public, and a moved tag would otherwise change what runs.
# * gofmt lists TRACKED files, never `.`, so a module cache inside the workspace
#   cannot put a dependency's formatting into our gate.
name: test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # A hung job would otherwise sit for the Actions default of six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: gofmt (tracked files only)
        run: |
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then echo "gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: go.mod is tidy
        # A published module's go.mod must describe itself honestly: two direct
        # dependencies were marked `// indirect` until this gate existed.
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: race
        # The control-mode adapter's subscriber fan-out is concurrent by nature.
        run: go test -race ./... -count=1

  tmux:
    # The one job with a runtime dependency: the adapter's integration test
    # needs a real tmux, so it is tagged in rather than skipped — "0 tests ran"
    # must never be mistaken for "the adapter works".
    runs-on: ubuntu-latest
    # A control-mode attach that never exits is exactly the failure this job
    # exists to catch; it must fail fast, not hold a runner for six hours.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: tmux -V
      - name: integration test against a real tmux
        run: go test -race -tags tmux ./internal/infra/tmux/ -count=1
      - name: no session left behind
        run: |
          if tmux ls 2>/dev/null | grep -q '^sfagent-'; then
            echo "leaked tmux sessions:"; tmux ls; exit 1
          fi
