# The gates, on GitHub — this repository's home.
#
# Ported from the .gitlab-ci.yml this project started with. Two lessons from
# that file are kept deliberately:
#
# * The Go version comes FROM go.mod (`go-version-file`), not from a pinned
#   image tag. On GitLab the image was golang:1.24 against a go.mod asking for
#   1.25.0; with GOTOOLCHAIN=local that failed the first command of every
#   pipeline the repository ever ran, while local gates were green.
# * gofmt lists TRACKED files, never `.`, so a module cache inside the workspace
#   cannot put a dependency's formatting into our gate.
name: test

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: build
        run: go build ./...
      - name: test
        run: go test ./... -count=1
      - name: gofmt (tracked files only)
        run: |
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then echo "gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: go.mod is tidy
        # A published module's go.mod must describe itself honestly: two direct
        # dependencies were marked `// indirect` until this gate existed.
        run: go mod tidy && git diff --exit-code go.mod go.sum
      - name: race
        # The control-mode adapter's subscriber fan-out is concurrent by nature.
        run: go test -race ./... -count=1

  tmux:
    # The one job with a runtime dependency: the adapter's integration test
    # needs a real tmux, so it is tagged in rather than skipped — "0 tests ran"
    # must never be mistaken for "the adapter works".
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install tmux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: tmux -V
      - name: integration test against a real tmux
        run: go test -race -tags tmux ./internal/infra/tmux/ -count=1
      - name: no session left behind
        run: |
          if tmux ls 2>/dev/null | grep -q '^sfagent-'; then
            echo "leaked tmux sessions:"; tmux ls; exit 1
          fi
