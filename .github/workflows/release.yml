# Publishes a GitHub Release with prebuilt binaries when a vX.Y.Z tag is
# pushed. The Go module version itself needs nothing from here:
# proxy.golang.org serves `go install …@vX.Y.Z` straight from the tag — and
# caches it FOREVER, which is why a tag is only ever pushed deliberately.
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # upload the archives to the Release

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0   # GoReleaser needs the history for the changelog
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25.x'
          check-latest: true
      - name: gates, again, on the tagged tree
        run: go test ./... -count=1 && go vet ./...
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
